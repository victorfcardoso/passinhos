/* Tokens sampled from the reference bank-app screenshots. Orange stays on
   icons and hexagons only, as in the app; text, links and progress are ink/navy. */
:root {
  --bg: #F1F2F4; --sheet: #F0F1F3; --surface: #FFFFFF; --muted: #E4E5E9; --soft: #F1F2F4;
  --ink: #141416; --ink2: #3A3A3C; --ink3: #4C4C50; --ink4: #8E8E93;
  --line: #D9DADF; --track: #E3E4E8; --navy: #000C3C;
  --orange: #FF6200; --orange-d: #C24E00; --orange-t: #FFEDE0;
  --green: #0B4430; --green-t: #E2EFE8; --red: #B3261E; --red-t: #FBEAEA;
  --ai-spark: #EC6C2D; --ai-peach: #FFDFCC;   /* the guide's star and the bottom of its background */
  --ai-ease: cubic-bezier(.2,.8,.2,1); --ai-ease-io: cubic-bezier(.77,0,.175,1);   /* EASE below, as CSS; in-out only for pulses */
  --card-px: 24px;
  color-scheme: light;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { font-family: 'Noto Sans', system-ui, -apple-system, 'Segoe UI', sans-serif; color: var(--ink); font-size: 14px;
  line-height: 1.4; -webkit-font-smoothing: antialiased; background: #DCDDE2; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; text-align: inherit; }
button:disabled { cursor: default; }
:focus-visible { outline: 2px solid var(--navy); outline-offset: 2px; border-radius: 8px; }
input { font: inherit; }
.i { display: block; flex: none; }
[hidden] { display: none !important; }

/* ---------------------------------------------------------------- stage + phone */
.stage { min-height: 100dvh; display: flex; align-items: center; justify-content: center; gap: 48px; padding: 24px; }
.phone { position: relative; width: 390px; height: min(844px, calc(100dvh - 48px)); flex: none; border-radius: 52px;
  background: var(--bg); overflow: hidden; display: flex; flex-direction: column;
  box-shadow: 0 0 0 11px #141416, 0 0 0 12px #3A3A3C, 0 40px 90px rgba(0,0,0,.28); }
.island { position: absolute; top: 11px; left: 50%; width: 122px; height: 35px; margin-left: -61px; border-radius: 20px;
  background: #000; z-index: 60; pointer-events: none; }
.status { height: 50px; flex: none; display: flex; align-items: center; justify-content: space-between;
  padding: 6px 30px 0 44px; font-weight: 600; font-size: 16px; letter-spacing: -.2px; position: relative; z-index: 5; }
.status svg { fill: currentColor; }
.sb-r { display: flex; gap: 6px; align-items: center; }
.phone.white-top .status { background: #fff; }
.viewport { flex: 1; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; position: relative;
  background: var(--bg); touch-action: pan-y; }
.viewport::-webkit-scrollbar { display: none; }
.viewport.white { background: #fff; }
.scroll { min-height: 100%; display: flex; flex-direction: column; }
.pad { padding: 0 24px 40px; }

/* ---------------------------------------------------------------- demo panel */
.panel { width: 320px; background: #fff; border-radius: 24px; padding: 24px; align-self: center;
  box-shadow: 0 10px 40px rgba(0,0,0,.08); }
.p-brand { font-size: 22px; font-weight: 700; letter-spacing: -.6px; display: flex; align-items: center; gap: 10px; }
.p-sub { font-size: 13px; color: var(--ink3); margin-top: 4px; }
.p-k { font-size: 12px; font-weight: 600; color: var(--ink3); margin: 22px 0 8px; text-transform: uppercase; letter-spacing: .4px; }
.seg2 { display: grid; grid-template-columns: 1fr 1fr; background: var(--bg); border-radius: 12px; padding: 4px; gap: 4px; }
.seg2 button { height: 40px; border-radius: 9px; font-weight: 600; font-size: 13.5px; text-align: center; color: var(--ink2); }
.seg2 button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.1); }
.p-stat { margin-top: 12px; font-size: 13px; color: var(--ink2); display: flex; align-items: center; gap: 8px; }
.steps { list-style: none; display: flex; flex-direction: column; gap: 6px; }
.steps button { width: 100%; display: flex; gap: 12px; align-items: flex-start; padding: 10px 12px; border-radius: 12px;
  font-size: 13.5px; line-height: 1.35; }
.steps button:hover { background: var(--bg); }
.steps .n { width: 22px; height: 22px; border-radius: 50%; background: var(--bg); display: grid; place-items: center;
  font-size: 12px; font-weight: 700; flex: none; }
.steps .n.ok { background: var(--green); color: #fff; }
.p-reset { margin-top: 18px; width: 100%; height: 42px; border-radius: 999px; box-shadow: inset 0 0 0 1.5px var(--line);
  font-weight: 600; font-size: 13.5px; display: flex; align-items: center; justify-content: center; gap: 8px; }
.p-reset.armed { background: var(--red-t); color: var(--red); box-shadow: inset 0 0 0 1.5px var(--red); }
.p-note { font-size: 12px; color: var(--ink4); margin-top: 10px; text-align: center; }
.proto-strip { display: none; }

@media (max-width: 760px) {
  .stage { display: block; padding: 0; }
  .panel { display: none; }
  .phone { width: 100%; height: 100dvh; border-radius: 0; box-shadow: none; }
  .island, .status { display: none; }
  .proto-strip { display: flex; flex: none; align-items: center; justify-content: flex-end; gap: 12px; background: #fff;
    color: var(--ink); font-size: 12px; padding: calc(6px + env(safe-area-inset-top)) 12px 6px 16px; }
  .proto-strip button { height: 26px; padding: 0 12px; border-radius: 999px; background: var(--bg); color: var(--ink2, var(--ink));
    font-weight: 600; font-size: 12px; }
  .demo-panel-sheet .panel { display: block; width: auto; box-shadow: none; padding: 0; }
  .toast { top: calc(44px + env(safe-area-inset-top)); }
}

/* ---------------------------------------------------------------- nav + type */
.nav { height: 56px; display: flex; align-items: center; gap: 10px; padding: 0 14px; flex: none; }
.nav-back { width: 40px; height: 40px; display: grid; place-items: center; color: var(--ink2); border-radius: 50%; }
.nav-t { font-size: 16px; letter-spacing: -.1px; }
.nav-r { margin-left: auto; width: 40px; height: 40px; display: grid; place-items: center; color: var(--ink2); border-radius: 50%; }
.title { font-size: 24px; font-weight: 700; letter-spacing: -.8px; line-height: 1.2; margin: 6px 0 6px; text-wrap: balance; }
.lead { font-size: 13.5px; color: var(--ink2); line-height: 1.45; text-wrap: balance; }
.h2 { font-size: 18px; font-weight: 400; letter-spacing: -.3px; margin: 34px 0 14px; }

/* ---------------------------------------------------------------- cards */
.card { background: var(--surface); border-radius: 16px; }
.tap { transition: transform .12s ease, filter .12s ease; }
.tap:active { transform: scale(.985); }
@media (hover: hover) { .tap:hover { filter: brightness(.985); } }
.stack { display: flex; flex-direction: column; gap: 18px; }
.stack.tight { gap: 14px; }
.stats { background: #fff; border-radius: 16px; display: grid; grid-template-columns: 1fr 1fr; padding: 20px 0; margin-top: 28px; }
.stats > div { text-align: center; padding: 0 8px; }
.stats > div + div { border-left: 1px solid var(--line); }
.stats small { display: block; font-size: 11.5px; color: var(--ink2); margin-bottom: 3px; }
.stats b { font-size: 13.5px; font-weight: 600; }
.ic-circle { width: 38px; height: 38px; border-radius: 50%; border: 1.5px solid #CDCED3; display: grid; place-items: center;
  color: var(--ink2); flex: none; background: #fff; }
.ic-circle.sm { width: 34px; height: 34px; }
.ic-circle.lg { width: 44px; height: 44px; }

.act { display: block; width: 100%; padding: 22px var(--card-px); }
.act-top { display: flex; justify-content: space-between; align-items: center; color: var(--ink2); }
.act-title { font-size: 15.5px; font-weight: 600; color: var(--ink2); margin-top: 16px; line-height: 1.4; letter-spacing: -.15px; text-wrap: pretty; }
.chip + .act-title { margin-top: 8px; }
.act-desc, .act-meta { font-size: 12.5px; color: var(--ink3); margin-top: 4px; line-height: 1.4; text-wrap: pretty; }
.act .bar, .act .seg { margin-top: 12px; }
.act-div { height: 1px; background: var(--line); margin-top: 16px; }
.reward-box { display: flex; align-items: center; gap: 14px; height: 52px; margin-top: 16px; padding: 0 22px; border-radius: 16px;
  background: var(--bg); font-size: 14.5px; color: var(--ink2); }
.reward-box .hex { color: var(--ink2); }
.act-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; }
.act-reward { font-size: 14px; color: var(--ink2); }
.act-link { display: inline-flex; align-items: center; gap: 2px; font-size: 14px; font-weight: 600; color: var(--ink); }
.act-status { display: flex; align-items: center; gap: 8px; margin-top: 12px; padding: 10px 12px; border-radius: 12px;
  background: var(--bg); font-size: 12.5px; color: var(--ink2); line-height: 1.35; }
.act-status.warn { background: var(--red-t); color: var(--red); }
.chip { display: inline-flex; align-items: center; gap: 6px; margin-top: 16px; background: var(--bg); border-radius: 8px;
  padding: 4px 10px 4px 8px; font-size: 12px; font-weight: 500; color: var(--ink2); }
.pill { display: inline-flex; align-items: center; gap: 7px; background: var(--bg); border-radius: 10px; padding: 6px 12px 6px 10px;
  font-size: 12.5px; color: var(--ink2); }
.pill .hex { color: var(--ink2); }
.pill.white { background: #fff; }
.pill.sm { padding: 3px 9px 3px 7px; gap: 5px; font-size: 11.5px; font-weight: 600; border-radius: 8px; }
.pill.big { font-size: 12.5px; font-weight: 600; padding: 5px 11px 5px 9px; gap: 6px; margin-top: 4px; }
.pill.ok { background: var(--green-t); color: var(--green); }

.bar { height: 7px; border-radius: 99px; background: var(--track); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--navy); border-radius: 99px; }
.bar.thin { height: 4px; }
.bar.thick { height: 9px; }
.seg { display: grid; gap: 5px; }
.seg i { height: 7px; border-radius: 9px; background: var(--track); transform-origin: left center; }
.seg i.on { background: var(--navy); }

.done { width: 100%; background: var(--muted); border-radius: 16px; padding: 20px 22px; display: flex; align-items: center; gap: 16px; }
.ic-soft { position: relative; width: 38px; height: 38px; border-radius: 50%; background: var(--soft); display: grid;
  place-items: center; color: var(--ink2); flex: none; }
.ok-dot { position: absolute; right: -2px; bottom: 0; width: 13px; height: 13px; border-radius: 50%; background: var(--green);
  color: #fff; display: grid; place-items: center; box-shadow: 0 0 0 1.5px var(--muted); }
.done-t { font-size: 14px; line-height: 1.35; text-wrap: pretty; }
.done-s { font-size: 12.5px; color: var(--green); font-weight: 600; margin-top: 3px; }
.done.fresh { animation: fresh 1.6s ease; }
@keyframes fresh { 0% { box-shadow: inset 0 0 0 2px var(--green); } 100% { box-shadow: inset 0 0 0 2px transparent; } }

.rules { width: 100%; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--line);
  margin-top: 34px; padding: 22px 0 0; font-size: 15px; font-weight: 600; color: var(--ink2); }

.hex { position: relative; display: inline-block; flex: none; line-height: 0; }
.hex svg text { font-family: 'Noto Sans', sans-serif; }
.hex-lock { position: absolute; right: -6px; bottom: -2px; width: 17px; height: 17px; border-radius: 50%;
  background: var(--lock-bg, #fff); color: var(--orange); display: grid; place-items: center; }

/* ---------------------------------------------------------------- home */
.hero { display: flex; flex-direction: column; align-items: center; padding: 4px 24px 20px; }
.ring { position: relative; width: 150px; height: 150px; }
.ring > svg { position: absolute; inset: 0; }
.ring-hex { position: absolute; inset: 0; display: grid; place-items: center; }
.hero-hi { font-size: 14px; color: var(--ink2); margin-top: 4px; }
.hero-t { font-size: 21px; letter-spacing: -.5px; margin-top: 1px; text-align: center; }
.hero-link { display: flex; align-items: center; gap: 4px; font-size: 13.5px; margin-top: 8px; padding: 6px 10px; border-radius: 99px; }
.duo { --lock-bg: var(--sheet); background: var(--sheet); border-radius: 16px; display: grid; grid-template-columns: 1fr 1fr; padding: 18px 0 16px; }
.duo > div { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 0 10px; }
.duo > div + div { border-left: 1px solid var(--line); }
.duo .hex { margin-bottom: 8px; color: var(--ink2); }
.duo small { font-size: 12px; color: var(--ink2); }
.duo b { font-size: 14px; font-weight: 600; margin-top: 2px; }
.mission { width: 100%; background: var(--sheet); border-radius: 16px; margin-top: 14px; padding: 18px 16px 18px 18px; display: flex;
  gap: 14px; align-items: center; color: var(--ink2); }
.m-ic { width: 40px; height: 40px; border-radius: 50%; background: #fff; display: grid; place-items: center; flex: none; align-self: flex-start; }
.m-body { flex: 1; color: var(--ink); }
.m-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.m-k { font-size: 12px; color: var(--ink2); }
.m-t { font-size: 15px; font-weight: 600; margin-top: 4px; letter-spacing: -.15px; text-wrap: pretty; }
.mission .seg { margin-top: 10px; }
.mission .seg i { height: 6px; }
.m-s { font-size: 12px; color: var(--ink2); margin-top: 3px; }
.sheet-sec { background: var(--sheet); border-radius: 28px 28px 0 0; margin-top: 8px; padding: 24px 24px 40px; flex: 1; }
.sheet-h { font-size: 18px; font-weight: 600; letter-spacing: -.4px; margin-bottom: 14px; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); grid-auto-rows: 1fr; gap: 8px; }
.tile { background: #fff; border-radius: 16px; padding: 14px 12px; display: flex; flex-direction: column; min-height: 124px; }
.tile-t { font-size: 14px; font-weight: 600; line-height: 1.25; margin-top: auto; padding-top: 18px; letter-spacing: -.2px; text-wrap: pretty; }
.tile-s { font-size: 11px; color: var(--ink2); margin: 3px 0 7px; }

/* ---------------------------------------------------------------- níveis */
.stack.lv { margin-top: 24px; gap: 12px; }
.lvl { padding: 16px var(--card-px); }
.lvl-row { display: flex; align-items: center; gap: 12px; }
.lvl-txt { flex: 1; }
.lvl-n { font-size: 15.5px; font-weight: 600; letter-spacing: -.2px; }
.lvl-r { font-size: 12px; color: var(--ink3); }
.lvl.locked .lvl-n { color: var(--ink2); }
.muted-ic { color: var(--ink4); display: inline-flex; }
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 600; border-radius: 8px; padding: 3px 8px; flex: none; }
.tag.green { background: var(--green-t); color: var(--green); }
.tag.navy { background: var(--navy); color: #fff; }
.lvl-b { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; color: var(--ink2); margin-top: 12px; padding-top: 12px;
  border-top: 1px solid #EDEEF1; line-height: 1.4; text-wrap: pretty; }
.lvl-b .i { color: var(--ink3); margin-top: 1px; }
.lvl .bar { margin-top: 12px; }
.lvl-p { font-size: 12.5px; color: var(--ink3); margin-top: 6px; }
.note { margin-top: 16px; background: var(--muted); border-radius: 16px; padding: 18px var(--card-px); display: flex; gap: 14px; }
.note.white { background: #fff; }
.note.mid { align-items: center; }
.note-t { font-size: 14.5px; font-weight: 600; }
.note-s { font-size: 13px; color: var(--ink2); margin-top: 2px; line-height: 1.45; text-wrap: pretty; }

/* ---------------------------------------------------------------- família */
.role { display: inline-block; margin-top: 4px; font-size: 11.5px; font-weight: 600; color: #fff; background: var(--navy);
  border-radius: 8px; padding: 4px 9px; letter-spacing: .1px; }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--orange-t); color: var(--orange-d); display: grid;
  place-items: center; font-weight: 700; font-size: 14px; flex: none; }
.avatar.lg { width: 44px; height: 44px; font-size: 18px; }
.kid { width: 100%; margin-top: 24px; padding: 16px var(--card-px); display: flex; align-items: center; gap: 12px; }
.kid-txt { flex: 1; }
.kid-n { font-size: 16px; font-weight: 600; }
.kid-s { font-size: 12.5px; color: var(--ink3); }
.kid > .i { color: var(--ink2); }
.ask { padding: 18px var(--card-px) 20px; }
.ask + .ask { margin-top: 12px; }
.ask-row { display: flex; gap: 12px; align-items: center; }
.ask-t { font-size: 16px; font-weight: 600; letter-spacing: -.2px; }
.ask-s { font-size: 12.5px; color: var(--ink3); text-wrap: pretty; }
.btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
.btn { height: 48px; border-radius: 999px; display: flex; align-items: center; justify-content: center; gap: 6px; font-weight: 600;
  font-size: 15px; text-align: center; padding: 0 18px; }
.btn.primary { background: var(--orange); color: #fff; }
.btn.primary:disabled { background: var(--muted); color: var(--ink4); }
.btn.ghost { box-shadow: inset 0 0 0 1.5px var(--ink2); color: var(--ink); }
.btn.navy { background: var(--navy); color: #fff; }
.btn.block { width: 100%; margin-top: 18px; }
.list { padding: 0 var(--card-px); }
.li { width: 100%; display: flex; align-items: center; gap: 12px; padding: 16px 0; }
.li + .li { border-top: 1px solid #EDEEF1; }
.li-txt { flex: 1; }
.li-t { font-size: 14.5px; font-weight: 600; }
.li-s { font-size: 12.5px; color: var(--ink3); line-height: 1.35; text-wrap: pretty; }
.link { display: inline-flex; align-items: center; gap: 1px; color: var(--ink2); font-weight: 600; font-size: 14px; }
.toggle { width: 50px; height: 30px; border-radius: 99px; background: #D5D6DB; position: relative; flex: none; transition: background .2s; }
.toggle i { position: absolute; left: 2px; top: 2px; width: 26px; height: 26px; border-radius: 50%; background: #fff;
  box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: transform .2s; }
.toggle[aria-checked="true"] { background: #34C759; }
.toggle[aria-checked="true"] i { transform: translateX(20px); }

/* ---------------------------------------------------------------- lição */
.idea { margin-top: 18px; padding: 18px var(--card-px); }
.idea-k, .q-k { font-size: 12px; color: var(--ink2); font-weight: 500; }
.idea p { font-size: 14.5px; line-height: 1.5; margin-top: 6px; color: var(--ink2); text-wrap: pretty; }
.q { margin-top: 14px; padding: 18px var(--card-px) 20px; }
.q-t { font-size: 17px; font-weight: 600; letter-spacing: -.3px; line-height: 1.35; margin-top: 6px; text-wrap: pretty; }
.opts { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
.opt { width: 100%; display: flex; align-items: center; gap: 12px; border-radius: 12px; box-shadow: inset 0 0 0 1.5px var(--line);
  padding: 14px 16px; font-size: 15px; transition: box-shadow .15s, background .15s; }
.radio { width: 20px; height: 20px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--ink4); flex: none; transition: box-shadow .15s; }
.opt.on { box-shadow: inset 0 0 0 2px var(--navy); }
.opt.on .radio { box-shadow: inset 0 0 0 6px var(--navy); }
.opt.right { box-shadow: inset 0 0 0 2px var(--green); background: var(--green-t); }
.opt.right .radio { box-shadow: inset 0 0 0 6px var(--green); }
.opt.wrong { box-shadow: inset 0 0 0 2px var(--red); background: var(--red-t); }
.opt.wrong .radio { box-shadow: inset 0 0 0 6px var(--red); }
.result { margin-top: 14px; border-radius: 16px; padding: 16px var(--card-px); display: flex; gap: 12px; align-items: flex-start; }
.result.yes { background: var(--green-t); color: var(--green); }
.result.no { background: #fff; color: var(--ink2); }
.result b { display: block; font-size: 15px; }
.result span { font-size: 13.5px; line-height: 1.45; }

/* ---------------------------------------------------------------- sonho */
.dream { margin-top: 28px; padding: 20px var(--card-px) 18px; }
.dream-top { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; }
.dream-k { font-size: 12px; color: var(--ink2); }
.dream-t { font-size: 19px; font-weight: 700; letter-spacing: -.4px; }
.dream-row { display: flex; justify-content: space-between; margin-top: 8px; font-size: 12.5px; color: var(--ink2); }
.dream-row b { color: var(--ink); font-weight: 600; }

/* ---------------------------------------------------------------- sheets, modal, toast */
.overlay { position: absolute; inset: 0; z-index: 30; display: flex; align-items: flex-end; background: rgba(10,12,20,.36); }
.overlay.enter { animation: fade .2s ease; }
@keyframes fade { from { background: rgba(10,12,20,0); } }
.sh, .sh-leave { width: 100%; max-height: 90%; overflow-y: auto; background: #fff; border-radius: 26px 26px 0 0;
  padding: 10px 24px calc(28px + env(safe-area-inset-bottom)); scrollbar-width: none; }
.overlay.enter .sh { animation: up .3s cubic-bezier(.2,.85,.25,1); }
@keyframes up { from { transform: translateY(100%); } }
.grab { width: 40px; height: 5px; border-radius: 9px; background: #D5D6DB; margin: 0 auto 6px; position: relative; }
/* The handle and the title bar are where a sheet is dragged down to close; the handle gets a wider hit area. */
.grab::before { content: ""; position: absolute; inset: -12px -100px -8px; }
.grab, .sh-head { touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; }
.sh-head { display: flex; align-items: flex-start; gap: 12px; margin-top: 8px; }
.sh-head h3 { flex: 1; font-size: 20px; font-weight: 700; letter-spacing: -.5px; line-height: 1.25; text-wrap: balance; }
.sh-x { width: 34px; height: 34px; border-radius: 50%; background: var(--bg); display: grid; place-items: center; color: var(--ink2); flex: none; }
.sh p, .sh-leave p, .sh-p { font-size: 14px; color: var(--ink2); line-height: 1.5; margin-top: 8px; text-wrap: pretty; }
.sh .pill, .sh-leave .pill { margin-top: 12px; }
.field { display: flex; flex-direction: column; gap: 6px; margin-top: 16px; }
.field label { font-size: 12.5px; font-weight: 500; color: var(--ink2); }
.field input { height: 50px; border-radius: 12px; border: 1.5px solid var(--line); padding: 0 14px; font-size: 16px; color: var(--ink);
  background: #fff; width: 100%; }
.field input:focus { outline: none; border-color: var(--navy); }
.field .err { font-size: 12.5px; color: var(--red); min-height: 18px; }
.money { position: relative; }
.money input { padding-left: 44px; }
.money::before { content: "R$"; position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 16px; color: var(--ink3); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.chipbtn { height: 42px; padding: 0 18px; border-radius: 999px; box-shadow: inset 0 0 0 1.5px var(--line); font-weight: 600; font-size: 14px; }
.chipbtn:hover { box-shadow: inset 0 0 0 1.5px var(--ink2); }
.box { margin-top: 16px; background: var(--bg); border-radius: 16px; padding: 16px 18px; }
.box .row { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; color: var(--ink2); }
.box .row b { font-size: 17px; color: var(--ink); font-weight: 600; }
.box .bar, .box .seg { margin-top: 10px; }
.out { margin-top: 12px; font-size: 13.5px; color: var(--ink2); min-height: 20px; }
.out b { color: var(--ink); }
.hint { margin-top: 14px; font-size: 12.5px; color: var(--ink3); border: 1.5px dashed var(--line); border-radius: 12px; padding: 10px 12px; }
.hint b { color: var(--ink2); }
.sim { display: inline-flex; align-items: center; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px;
  color: var(--ink3); background: var(--bg); border-radius: 6px; padding: 2px 6px; margin-right: 6px; }
.btn .sim { background: rgba(255,255,255,.2); color: inherit; }
.msg { margin-top: 16px; background: var(--bg); border-radius: 16px; padding: 14px 16px; }
.msg-from { font-size: 12px; color: var(--ink3); display: flex; align-items: center; gap: 6px; }
.msg-text { margin-top: 6px; background: #fff; border-radius: 4px 16px 16px 16px; padding: 12px 14px; font-size: 14.5px; line-height: 1.45; }
.qprog { font-size: 12px; color: var(--ink3); margin-top: 4px; }
.sum-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; }
.sum-row + .sum-row { border-top: 1px solid #EDEEF1; }
.sum-row .t { flex: 1; font-size: 14px; }
.sum-row .t small { display: block; color: var(--ink3); font-size: 12px; }
.sum-row .bar { width: 90px; }
.help li { display: flex; gap: 12px; margin-top: 14px; font-size: 14px; color: var(--ink2); line-height: 1.45; }
.help li .hex { margin-top: 1px; color: var(--orange); }

.modal { position: absolute; inset: 0; z-index: 45; display: grid; place-items: center; padding: 24px; background: rgba(10,12,20,.5); }
.modal-card { background: #fff; border-radius: 28px; padding: 30px 24px 22px; width: 100%; text-align: center; }
.modal.enter { animation: fade .25s ease; }
.modal.enter .modal-card { animation: pop .45s cubic-bezier(.2,1.4,.4,1); }
.modal.enter .modal-card .hex { animation: bounce .7s .2s cubic-bezier(.3,1.6,.5,1) both; }
@keyframes pop { from { transform: scale(.8); opacity: 0; } }
@keyframes bounce { from { transform: scale(.3) rotate(-24deg); } }
.modal-card .hex { margin: 0 auto; }
.modal-k { font-size: 13px; font-weight: 600; color: var(--orange-d); margin-top: 16px; text-transform: uppercase; letter-spacing: .6px; }
.modal-card h3 { font-size: 24px; font-weight: 700; letter-spacing: -.7px; margin-top: 4px; }
.modal-b { margin-top: 14px; background: var(--bg); border-radius: 14px; padding: 12px 14px; display: flex; gap: 10px; text-align: left;
  font-size: 13.5px; color: var(--ink2); line-height: 1.4; }

/* Banner at the top, like iOS notifications: it never covers a sheet's or page's bottom button. */
.toast { position: absolute; left: 14px; right: 14px; top: 56px; z-index: 50; background: #141416;
  color: #fff; border-radius: 16px; padding: 13px 16px; display: flex; gap: 12px; align-items: center; transform: translateY(-16px);
  box-shadow: 0 10px 30px rgba(0,0,0,.25);
  opacity: 0; transition: transform .22s ease, opacity .22s ease; pointer-events: none; }
.toast.show { transform: none; opacity: 1; transition: transform .45s cubic-bezier(.3,1.5,.5,1), opacity .18s ease; }
.toast .t1 { font-weight: 600; font-size: 14px; }
.toast .t2 { font-size: 12.5px; color: #C9CAD0; }
.toast .hex { color: var(--orange); }

/* ---------------------------------------------------------------- motion */
.nav-ghost { position: absolute; overflow: hidden; pointer-events: none; background: var(--bg); }
.nav-ghost.white { background: #fff; }
.overlay.leaving { pointer-events: none; }
.confetti { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 46; pointer-events: none; }

/* ---------------------------------------------------------------- AI guide */
/* Modelled on the bank app's own assistant: a white star button in the corner opens a full-screen layer,
   white fading to peach, with only an X at the top and a pill input at the bottom. Answers are plain text
   under an orange star; your messages are grey bubbles. Motion is transform and opacity on one curve
   (--ai-ease, the app's EASE); the global reduced-motion rule at the end makes all of it instant. */
.ai-fab { position: absolute; right: 24px; bottom: 24px; z-index: 25; width: 56px; height: 56px; border-radius: 20px;
  display: grid; place-items: center; background: #fff; color: var(--ai-spark);
  box-shadow: inset 0 0 0 1.5px var(--ai-spark), 0 4px 14px rgba(0,12,60,.12), 0 1px 3px rgba(0,12,60,.08);
  transition: transform 160ms var(--ai-ease); }
.ai-fab svg, .ai-mark svg, .ai-star svg, .ai-act svg, .ai-fb svg { display: block; }
.ai-fab:active { transform: scale(.95); }
.ai-fab.enter { animation: ai-pop 300ms var(--ai-ease) 250ms backwards; }   /* once per session; never from scale(0) */
.ai-fab:focus-visible { outline-offset: 3px; }
.phone.has-ai .scroll > .pad:last-child, .phone.has-ai .scroll > .sheet-sec:last-child { padding-bottom: 100px; }
.phone.ai-on .status { z-index: 41; }   /* the clock stays on top of the white, as on the phone */

/* The layer grows out of the button: a transition keyed off data-state, so a close mid-open retargets.
   JS sets transform-origin to the button's centre; the fallback below is roughly the same point. */
.ai-wrap { position: absolute; inset: 0; z-index: 40; display: flex; flex-direction: column; padding-top: 50px; background: #fff;
  border-radius: inherit; overflow: hidden; transform-origin: calc(100% - 52px) calc(100% - 52px);
  transition: opacity 300ms var(--ai-ease), transform 300ms var(--ai-ease); }
.ai-wrap[data-state="closed"], .ai-wrap[data-state="closing"] { opacity: 0; transform: scale(.94); }
.ai-wrap[data-state="closing"] { transition-duration: 200ms; pointer-events: none; }
.ai-wrap:focus { outline: none; }
/* The peach ramp is its own layer, painted once: plain white under the loader, then faded in. It eases in
   (still #FFF6F0 at 75%); a two-stop gradient looks wrong. */
.ai-wrap::before { content: ""; position: absolute; inset: 0; pointer-events: none; transition: opacity 300ms var(--ai-ease);
  background: linear-gradient(180deg, #FFFFFF 0%, #FFFFFF 56%, #FFFBF9 66%, #FFF6F0 75.5%, #FFF0E6 82%, #FFEBDE 87%, #FFE2D1 93.8%, var(--ai-peach) 96%, var(--ai-peach) 100%); }
.ai-wrap.loading::before { opacity: 0; }
.ai-head, .ai-body { position: relative; }
.ai-head { flex: none; height: 48px; display: flex; justify-content: flex-end; align-items: center; padding-right: 18px; }
.ai-x { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: var(--ink2);
  transition: transform 160ms var(--ai-ease), background-color 150ms ease; }
.ai-x:active { transform: scale(.95); }
.ai-body { flex: 1; min-height: 0; display: grid; grid-template: minmax(0, 1fr) / minmax(0, 1fr); }
.ai-body > * { grid-area: 1 / 1; min-height: 0; }   /* loader and chat share one cell: no jump at the hand-off */

/* Loader, first open of the session only: anchored low, the ring spins (rotate only), the star breathes. */
.ai-load { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding: 0 24px 40px;
  text-align: center; color: var(--ink3); transform-origin: 50% calc(100% - 107px); }
.ai-load.out { animation: ai-out 180ms var(--ai-ease) forwards; pointer-events: none; }
.ai-ring { position: relative; width: 66px; height: 66px; display: grid; place-items: center; }
.ai-spin { position: absolute; inset: 0; animation: ai-spin 800ms linear infinite; }
.ai-spin circle { fill: none; stroke-width: 3; stroke: var(--orange-t); }
.ai-spin .ai-arc { stroke: var(--orange); stroke-linecap: round; stroke-dasharray: 66 132; }
.ai-star { position: relative; color: var(--orange); animation: ai-breathe 600ms var(--ai-ease-io) infinite alternate; }
.ai-load-t { margin-top: 16px; font-size: 20px; line-height: 28px; font-weight: 600; letter-spacing: -.2px;
  animation: ai-nudge 240ms var(--ai-ease) 80ms backwards; }
.ai-load-s { margin-top: 4px; font-size: 14px; line-height: 20px; animation: ai-nudge 240ms var(--ai-ease) 130ms backwards; }

.ai-chat { display: flex; flex-direction: column; }
.ai-log { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; padding: 20px 24px 16px;
  display: flex; flex-direction: column;
  -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 12px, #000 calc(100% - 16px), transparent 100%);
  mask-image: linear-gradient(180deg, transparent 0, #000 12px, #000 calc(100% - 16px), transparent 100%); }
.ai-log::-webkit-scrollbar { display: none; }
.ai-row { display: flex; flex-direction: column; align-items: flex-start; }
.ai-row.me + .ai-row.bot { margin-top: 48px; }
.ai-row.bot + .ai-row.me { margin-top: 32px; }
.ai-msg { overflow-wrap: anywhere; }
/* Guide: the star, then plain text with no bubble. */
.ai-mark { width: 24px; height: 24px; display: grid; place-items: center; margin-bottom: 20px; color: var(--ai-spark); }
.ai-mark.live svg { animation: ai-breathe-mark 700ms var(--ai-ease-io) infinite alternate; }   /* the one "working" cue */
.ai-msg.bot { max-width: 100%; font-size: 16px; line-height: 1.55; color: var(--ink3); }
.ai-msg.bot:empty { display: none; }
.ai-msg p + p, .ai-msg p + ul, .ai-msg ul + p, .ai-msg ul + ul { margin-top: 16px; }
.ai-msg ul { padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.ai-msg b { font-weight: 650; color: inherit; }

function parseMoney(str) {
  const t = String(str).trim().replace(/\s|R\$/g, '');
  if (!t) return NaN;
  const norm = t.includes(',') ? t.replace(/\./g, '').replace(',', '.') : t;
  return /^\d+(\.\d{1,2})?$/.test(norm) ? Number(norm) : NaN;
}

function icon(name, size = 22, sw = 1.6, color) {

  return `<svg class="i" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"${style}>${ICONS[name] || ''}</svg>`;
}

function hexPath(cx, cy, R, r) {
  const pts = [-90, -30, 30, 90, 150, 210].map(a => [cx + R * Math.cos(a * Math.PI / 180), cy + R * Math.sin(a * Math.PI / 180)]);
  const toward = (a, b, d) => { const L = Math.hypot(b[0] - a[0], b[1] - a[1]); return [a[0] + (b[0] - a[0]) * d / L, a[1] + (b[1] - a[1]) * d / L]; };
  const f = n => n.toFixed(2);
  let out = '';
  for (let i = 0; i < 6; i++) {
    const p0 = pts[(i + 5) % 6], p1 = pts[i], p2 = pts[(i + 1) % 6];
    const a = toward(p1, p0, r), b = toward(p1, p2, r);
    out += `${i ? 'L' : 'M'}${f(a[0])},${f(a[1])}Q${f(p1[0])},${f(p1[1])} ${f(b[0])},${f(b[1])}`;
  }
  return out + 'Z';
}

let gradSeq = 0;
/* kind: gradient (current level), solid (orange), soft (done), outline (locked/neutral) */
function hexagon(s, kind = 'solid', num = null, lock = false) {
  // Corner rounding that reads as a hexagon at badge size turns into a circle at icon size.
  const rr = s >= 24 ? s * 0.14 : s * 0.06;
  let defs = '', shape, tcol;
  if (kind === 'gradient') {
    const id = 'hg' + (++gradSeq);
    defs = `<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFA35C"/><stop offset="1" stop-color="#EC6200"/></linearGradient></defs>`;
    shape = `<path d="${hexPath(s / 2, s / 2, s / 2 - 1.5, rr)}" fill="url(#${id})"/>`; tcol = '#fff';
  } else if (kind === 'solid') {
    shape = `<path d="${hexPath(s / 2, s / 2, s / 2 - 1.5, rr)}" fill="var(--orange)"/>`; tcol = '#fff';
  } else if (kind === 'soft') {
    shape = `<path d="${hexPath(s / 2, s / 2, s / 2 - 1.5, rr)}" fill="var(--orange-t)"/>`; tcol = 'var(--orange-d)';
  } else {
    const sw = s < 24 ? 1.3 : (s < 40 ? 1.6 : 1.8);
    shape = `<path d="${hexPath(s / 2, s / 2, s / 2 - sw, rr)}" fill="none" stroke="currentColor" stroke-width="${sw}"/>`; tcol = 'currentColor';
  }
  let text = '';
  if (num !== null) {
    const fs = (kind === 'gradient' ? s * 0.56 : s * 0.5).toFixed(1);
    text = `<text x="50%" y="50%" dy=".36em" text-anchor="middle" font-size="${fs}" font-weight="${kind === 'outline' ? 500 : 600}" fill="${tcol}">${num}</text>`;
  }
  const badge = lock ? `<span class="hex-lock">${icon('lock', 12, 2.2)}</span>` : '';
  return `<span class="hex" style="width:${s}px;height:${s}px"><svg width="${s}" height="${s}" viewBox="0 0 ${s} ${s}" aria-hidden="true">${defs}${shape}${text}</svg>${badge}</span>`;
}

function levelRing(level, progress) {
  const size = 150, c = 75, r = 66, start = 135, sweep = 270;
  const pt = deg => [c + r * Math.cos(deg * Math.PI / 180), c + r * Math.sin(deg * Math.PI / 180)];
  const [x0, y0] = pt(start), [x1, y1] = pt(start + sweep);
  const p = Math.max(0.001, Math.min(1, progress));
  const track = `M${x0.toFixed(2)},${y0.toFixed(2)} A${r},${r} 0 1 1 ${x1.toFixed(2)},${y1.toFixed(2)}`;
  return `<div class="ring" role="img" aria-label="Nível ${level}, ${Math.round(p * 100)}% do caminho até o próximo"><svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true">
    <path d="${track}" fill="none" stroke="#EDEEF1" stroke-width="7" stroke-linecap="round"/>
    <path d="${track}" pathLength="1000" stroke-dasharray="1000 1000" stroke-dashoffset="${((1 - p) * 1000).toFixed(1)}" fill="none" stroke="var(--navy)" stroke-width="7" stroke-linecap="round"
      data-k="ring" data-tw="ring" data-v="${(level + p).toFixed(4)}"/></svg>
    <div class="ring-hex">${hexagon(92, 'gradient', level)}</div></div>`;
}

   changed values glide to their new number, a new level gets confetti. Each piece checks
   reduced() itself: the CSS reduce rule stops CSS animations, not Web Animations. */

function buzz(pattern) {
  // Android only: iOS has no web vibration. Chrome refuses (and warns) before the first tap.
  try { if (navigator.userActivation?.hasBeenActive) navigator.vibrate?.(pattern); } catch { /* unsupported */ }
}

/* What is leaving the screen keeps its look for a moment but stops being live UI:
   no ids, no data-a actions, no focus, hidden from screen readers. */
function retire(el) {
  el.inert = true;
  el.setAttribute('aria-hidden', 'true');
  for (const n of [el, ...el.querySelectorAll('*')]) {
    if (n.tagName !== 'linearGradient') n.removeAttribute('id');   // badge gradients are unique and still painting
    for (const a of [...n.attributes]) if (a.name.startsWith('data-')) n.removeAttribute(a.name);
  }
  return el;
}

  ghost.className = 'nav-ghost' + (vp.classList.contains('white') ? ' white' : '');
  Object.assign(ghost.style, { left: vp.offsetLeft + 'px', top: vp.offsetTop + 'px', width: vp.offsetWidth + 'px', height: vp.offsetHeight + 'px' });
  const old = vp.firstElementChild;
  if (old) { old.style.marginTop = -vp.scrollTop + 'px'; ghost.append(old); }
  vp.after(retire(ghost));
  trans = { dir, ghost, t: 0, anims: [] };
  mutate();
  const [under, over] = dir === 'push' ? [ghost, vp] : [vp, ghost];
  under.style.zIndex = 1; over.style.zIndex = 3;
  over.style.boxShadow = '-12px 0 32px rgba(10,12,20,.12)';

}
function runTrans(to, ms) {

  setFrame(to);

}
/* Also called first by anything that starts a new transition: a second tap jumps the running one to its end. */
function endTrans() {
  if (!trans) return;

  trans = null;
  anims.forEach(a => a.cancel());
  ghost.remove();

}
function navigate(dir, mutate) {
  if (reduced()) { endTrans(); mutate(); return; }
  beginTrans(dir, mutate);
  runTrans(1, PUSH_MS).onfinish = endTrans;
}

/* ---- sheets leave by sliding down; the leaving copy is retired so it never counts as the open sheet. */
let sheetExit = null;   // release speed of a drag-dismiss, so the sheet leaves at the finger's pace
function leaveSheet(el, hint) {
  const sh = el.querySelector('.sh'), top = sh.scrollTop, bg = getComputedStyle(el).backgroundColor;
  const y = parseFloat(sh.style.transform.slice('translateY('.length)) || 0;
  sh.className = 'sh-leave';
  el.className = 'overlay leaving';
  document.getElementById('overlay').before(retire(el));
  sh.scrollTop = top;
  const h = sh.offsetHeight, ms = hint ? Math.min(260, Math.max(140, (h - y) / Math.max(hint.v, 1))) : 240;
  const easing = hint ? 'cubic-bezier(.2,.7,.4,1)' : 'cubic-bezier(.4,0,1,1)';
  sh.animate([{ transform: `translateY(${y}px)` }, { transform: `translateY(${h}px)` }], { duration: ms, easing, fill: 'forwards' });
  el.animate([{ backgroundColor: bg }, { backgroundColor: 'rgba(10,12,20,0)' }], { duration: ms, easing, fill: 'forwards' }).onfinish = () => el.remove();
}

/* ---- gestures: edge swipe back on touch screens; a sheet dragged down by its top closes. */
let swipe = null, drag = null;
function track(g, e, pos) {
  g.pts.push([e.timeStamp, pos]);
  while (g.pts.length > 2 && e.timeStamp - g.pts[0][0] > 100) g.pts.shift();
}
function speed(g) {   // px per ms over the last ~100 ms
  const a = g.pts[0], b = g.pts.at(-1);
  return b && b[0] > a[0] ? (b[1] - a[1]) / (b[0] - a[0]) : 0;
}
function swallowClick() {   // a drag that ends over a button must not also press it
  const stop = ev => { ev.stopPropagation(); ev.preventDefault(); };
  document.addEventListener('click', stop, { capture: true, once: true });
  setTimeout(() => document.removeEventListener('click', stop, { capture: true }));
}
function moveSwipe(e) {
  const dx = e.clientX - swipe.x0, vp = document.getElementById('vp');
  if (!swipe.started) {
    if (Math.abs(e.clientY - swipe.y0) > Math.max(10, dx)) { swipe = null; return; }
    if (dx < 10) return;
    swipe.started = true;
    document.getElementById('phone').setPointerCapture(e.pointerId);
    swipe.live = !reduced();
    if (swipe.live) { swipe.route = route(); swipe.top = vp.scrollTop; beginTrans('pop', popScreen); }
  }
  track(swipe, e, e.clientX);
  if (swipe.live && trans) setFrame(Math.max(0, Math.min(1, dx / vp.offsetWidth)));
}
function endSwipe(sw, e, cancelled) {
  swallowClick();
  track(sw, e, e.clientX);
  if (!sw.live) { if (!cancelled && e.clientX - sw.x0 > 60) back(); return; }   // reduced motion: just the outcome
  if (!trans) return;
  if (!cancelled && (trans.t > .4 || speed(sw) > .45)) { runTrans(1, Math.max(120, (1 - trans.t) * PUSH_MS)).onfinish = endTrans; return; }
  runTrans(0, Math.max(120, trans.t * PUSH_MS)).onfinish = () => {
    endTrans();
    stack().push(sw.route); save(); render(true);
    document.getElementById('vp').scrollTop = sw.top;
  };
}
function moveDrag(e) {
  const d = drag, dy = e.clientY - d.y0;
  if (!d.sh.isConnected) { drag = null; return; }
  if (!d.started) {
    if (Math.abs(dy) < 6) return;
    d.started = true; d.h = d.sh.offsetHeight;
    document.getElementById('phone').setPointerCapture(e.pointerId);
  }
  track(d, e, e.clientY);
  d.y = dy > 0 ? dy : dy / 6;   // pulling up barely moves it
  d.sh.style.transform = `translateY(${d.y}px)`;
  d.sh.parentElement.style.backgroundColor = `rgba(10,12,20,${(.36 * (1 - Math.max(0, d.y) / d.h)).toFixed(3)})`;
}
function endDrag(d, e, cancelled) {
  swallowClick();
  track(d, e, e.clientY);
  if (!d.sh.isConnected) return;
  if (!cancelled && (d.y > d.h * .3 || (speed(d) > .5 && d.y > 24))) { sheetExit = { v: speed(d) }; closeSheet(); return; }
  const ov = d.sh.parentElement, bg = ov.style.backgroundColor;
  d.sh.style.transform = ''; ov.style.backgroundColor = '';
  if (reduced()) return;
  d.sh.animate([{ transform: `translateY(${d.y}px)` }, { transform: 'none' }], { duration: 380, easing: 'cubic-bezier(.3,1.25,.5,1)' });
  ov.animate([{ backgroundColor: bg }, { backgroundColor: 'rgba(10,12,20,.36)' }], { duration: 250, easing: 'ease-out' });
}
document.addEventListener('pointerdown', e => {
  if (!e.isPrimary || e.button > 0) return;
  const sh = e.target.closest('.sh');
  if (sh) {
    if (e.target.closest('.grab, .sh-head')) drag = { id: e.pointerId, y0: e.clientY, y: 0, sh, started: false, pts: [] };
    return;
  }
  const vp = document.getElementById('vp');
  if (e.pointerType !== 'mouse' && vp.contains(e.target) && stack().length > 1 && !ui.sheet && !ui.levelUp && !trans
      && e.clientX - vp.getBoundingClientRect().left <= 24) swipe = { id: e.pointerId, x0: e.clientX, y0: e.clientY, started: false, pts: [] };
});
document.addEventListener('pointermove', e => {
  if (drag?.id === e.pointerId) moveDrag(e);
  else if (swipe?.id === e.pointerId) moveSwipe(e);
});

  document.addEventListener(type, e => {
    if (drag?.id === e.pointerId) { const d = drag; drag = null; if (d.started) endDrag(d, e, cancelled); }
    else if (swipe?.id === e.pointerId) { const sw = swipe; swipe = null; if (sw.started) endSwipe(sw, e, cancelled); }
  });
}

/* ---- values. A bar, ring, segment row or counter that changed since it was last on screen
   glides from the old value to the new one. Templates name them with tw(key, kind, value). */
const shown = new Map();
let counting = 0;
const TWEEN = {
  w: (el, a, b, delay) => el.animate([{ width: a + '%' }, { width: b + '%' }], { duration: 700, delay, easing: EASE, fill: 'backwards' }),
  ring(el, a, b, delay) {   // value = level + progress; a new level fills from empty
    const lv = Math.ceil(b) - 1, from = Math.ceil(a) - 1 === lv ? a - lv : 0;
    el.animate([{ strokeDashoffset: (1 - from) * 1000 + 'px' }, { strokeDashoffset: (1 - (b - lv)) * 1000 + 'px' }],
      { duration: 900, delay, easing: EASE, fill: 'backwards' });
  },
  seg: (el, a, b, delay) => [...el.children].slice(a, b).forEach((i, k) =>
    i.animate([{ transform: 'scaleX(0)' }, { transform: 'none' }], { duration: 420, delay: delay + k * 90, easing: EASE, fill: 'backwards' })),
  n(el, a, b, delay) {
    const vp = document.getElementById('vp'), t0 = performance.now() + delay;
    counting++;
    vp.setAttribute('aria-busy', 'true');   // screen readers hear the final number, not every frame
    el.textContent = a;
    requestAnimationFrame(function tick(now) {
      const k = Math.min(1, Math.max(0, (now - t0) / 700));
      if (k < 1 && el.isConnected) { el.textContent = Math.round(a + (b - a) * (1 - (1 - k) ** 3)); requestAnimationFrame(tick); return; }
      el.textContent = b;
      if (!--counting) vp.removeAttribute('aria-busy');
    });
  },
};
function tweenValues() {
  const quiet = reduced(), delay = trans ? 180 : 0;   // let a sliding screen land a little first
  for (const el of document.querySelectorAll('#vp [data-k], #overlay [data-k]')) {
    const from = shown.get(el.dataset.k), to = +el.dataset.v;
    shown.set(el.dataset.k, to);
    if (!quiet && from < to) TWEEN[el.dataset.tw](el, from, to, delay);
  }
}
/* For the tests: nothing sliding, counting or leaving. */
function motionIdle() { return !trans && !counting && !document.querySelector('.overlay.leaving, #ai-wrap[data-state=closing]'); }

/* ---- level-up confetti: a short canvas burst from the badge; the canvas removes itself. */
function confetti(from) {
  if (reduced()) return;
  const phone = document.getElementById('phone'), pr = phone.getBoundingClientRect(), fr = from.getBoundingClientRect();
  const dpr = Math.min(2, devicePixelRatio || 1), c = document.createElement('canvas');
  c.className = 'confetti'; c.width = pr.width * dpr; c.height = pr.height * dpr;
  phone.append(c);
  const ctx = c.getContext('2d'), cx = fr.left + fr.width / 2 - pr.left, cy = fr.top + fr.height / 2 - pr.top;
  const COLORS = ['#FF6200', '#FFA35C', '#000C3C', '#FFFFFF'];
  const bits = Array.from({ length: 90 }, (_, k) => {
    const a = -Math.PI / 2 + (Math.random() - .5) * 2.4, v = 5 + Math.random() * 9;
    return { x: cx, y: cy, vx: Math.cos(a) * v, vy: Math.sin(a) * v, r: Math.random() * 6.3, vr: (Math.random() - .5) * .5,
      w: 5 + Math.random() * 5, h: 3 + Math.random() * 3, c: COLORS[k % COLORS.length] };
  });
  const t0 = performance.now();
  let last = t0;
  requestAnimationFrame(function tick(now) {
    const t = now - t0, k = Math.max(0, Math.min(3, (now - last) / 16.7));
    last = now;
    if (t > 1200 || !c.isConnected) { c.remove(); return; }
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, c.width, c.height);
    ctx.globalAlpha = t > 850 ? (1200 - t) / 350 : 1;
    for (const b of bits) {
      b.vy += .35 * k; b.vx *= .985 ** k; b.x += b.vx * k; b.y += b.vy * k; b.r += b.vr * k;
      const cos = Math.cos(b.r) * dpr, sin = Math.sin(b.r) * dpr;
      ctx.setTransform(cos, sin, -sin, cos, b.x * dpr, b.y * dpr);
      ctx.fillStyle = b.c;
      ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h);
    }
    requestAnimationFrame(tick);
  });
}

/* ================================================================ screens */
const SCREENS = {

          <div class="m-body"><div class="m-top"><span class="m-k">Missão da semana</span>${ptsPill(3, 'white sm')}</div>
          <div class="m-t">Guardar por 4${NB}semanas seguidas</div><div class="m-s">${s.weeks} de 4 semanas.${s.weeks === 3 ? ' Falta só esta!' : ''}</div>
          ${segbar(s.weeks, 4, 'mission')}</div>${CHEV}</button>`;
    const tiles = CATS.map(c => {

      return `<button type="button" class="tile tap" data-a="go" data-r="cat" data-id="${c.id}">${icon(c.icon, 22, 1.7, 'var(--orange)')}
        <div class="tile-t">${c.title.replace(/ ([eo]) /, ` $1${NB}`)}</div><div class="tile-s">${d} de ${t} passos</div>${bar(100 * d / t, 'thin', 'tile-' + c.id)}</button>`;
    }).join('');
    return { white: true, html: `${nav('Passinhos', right)}
      <div class="hero">${levelRing(L.n, prog)}<div class="hero-hi">Oi, Lia!</div><div class="hero-t">Você está no nível ${L.n}, ${L.name}</div>
        <button type="button" class="hero-link" data-a="go" data-r="levels">Confira todos os níveis ${CHEV_SM}</button></div>
      <div class="pad" style="padding-bottom:0"><div class="duo"><div>${hexagon(30, 'solid')}<small>Você já conquistou</small><b><span${tw('pts', 'n', p)}>${p}</span> ${plural(p)}</b></div>${nextBox}</div>${mission}</div>
      <div class="sheet-sec"><h2 class="sheet-h">Onde ganhar passos</h2><div class="tiles">${tiles}</div></div>` };
  },

  levels() {
    const p = points(), L = levelOf(p), N = nextLevel(L);
    const cards = LEVELS.map(lv => {
      const state = lv.n < L.n ? 'done' : lv.n === L.n ? 'current' : 'locked';
      const nx = LEVELS[lv.n];
      const rng = nx ? `${lv.min} a ${nx.min - 1} passos` : `${lv.min} a ${MAX_POINTS} passos`;
      const hx = state === 'done' ? hexagon(46, 'soft', lv.n) : state === 'current' ? hexagon(46, 'gradient', lv.n)

      const tag = state === 'done' ? `<span class="tag green">${icon('check', 12, 3)}Feito</span>` : state === 'current' ? '<span class="tag navy">Você está aqui</span>' : '';

    return { html: `${nav()}<div class="pad"><h1 class="title">Níveis</h1>

      <div class="note-s">Aqui ninguém perde nível. Os passos que você conquistou continuam seus.</div></div></div></div>` };
  },

  cat(r) {
    const c = CATS.find(x => x.id === r.id);
    const lead = typeof c.lead === 'function' ? c.lead(s) : c.lead;
    const todo = c.acts.filter(a => a.title && !isDone(a.id));
    const done = catDone(c).sort((a, b) => s.done[b.id] - s.done[a.id]);
    let top = '';
    if (c.id === 'sonho') {
      const got = s.dreamBought;
      top = `<div class="card dream"><div class="dream-top"><span class="ic-circle lg">${icon('bike', 24, 1.7)}</span>
        <div><div class="dream-k">${got ? 'Sonho realizado' : 'Seu sonho'}</div><div class="dream-t">Bicicleta</div></div></div>

          : `<b>${brl(Math.min(s.balance, 600))} de R$ 600,00</b><span>${s.balance >= 600 ? 'Chegou lá!' : `Faltam ${brl(600 - s.balance)}`}</span>`}</div></div>`;

         <div class="note-s">Novas atividades chegam em breve.</div></div></div>`;
    const doneHtml = done.length ? `<div class="stack tight">${done.map(doneCard).join('')}</div>`
      : `<div class="note mid"><span class="ic-soft">${hexagon(20, 'outline')}</span><div><div class="note-t">Nenhum passo aqui ainda</div>
         <div class="note-s">${c.id === 'seguro' ? 'O primeiro é o mais fácil: a senha leva menos de um minuto.' : 'Comece por uma das atividades acima.'}</div></div></div>`;
    return { html: `${nav()}<div class="pad"><h1 class="title">${c.title}</h1><p class="lead">${lead}</p>${top}${stats(c)}
      <h2 class="h2">Para fazer</h2>${todoHtml}<h2 class="h2">Concluídas</h2>${doneHtml}
      <button type="button" class="rules" data-a="sheet" data-t="help"><span>Como funcionam os passos</span>${CHEV}</button></div>` };
  },

  lesson(r) {
    const a = ACT[r.id], L = LESSONS[r.id], done = isDone(r.id);
    const res = ui.result[r.id];          // 'yes' | 'no' | undefined
    const pick = done && !res ? L.ok : ui.pick[r.id];
    const opts = L.opts.map((o, k) => {
      let cls = '';
      if (res === 'yes' || (done && !res)) cls = k === L.ok ? ' right' : '';
      else if (res === 'no') cls = k === pick ? ' wrong' : '';

    }).join('');

/* ================================================================ render */
let lastRouteKey = '';
function render(resetScroll = false) {
  const vp = document.getElementById('vp');
  const r = route();
  const key = s.persona + ':' + JSON.stringify(r);
  const keep = vp.scrollTop;
  const out = SCREENS[r.r](r);
  vp.className = 'viewport' + (out.white ? ' white' : '');
  document.getElementById('phone').classList.toggle('white-top', !!out.white);
  vp.innerHTML = `<div class="scroll">${out.html}</div>`;
  vp.scrollTop = resetScroll || key !== lastRouteKey ? 0 : keep;
  lastRouteKey = key;
  ui.fresh = null;

  const ov = document.getElementById('overlay');
  if (ui.sheet) {
    const sheetKey = ui.sheet.t + (ui.sheet.id || '');
    const entering = sheetKey !== ui.sheetKey;
    const shScroll = ov.querySelector('.sh')?.scrollTop || 0;
    ov.innerHTML = `<div class="overlay${entering ? ' enter' : ''}" data-a="backdrop"><div class="sh" role="dialog" aria-modal="true">${SHEETS[ui.sheet.t](ui.sheet)}</div></div>`;
    if (!entering) ov.querySelector('.sh').scrollTop = shScroll;
    ui.sheetKey = sheetKey;
    // Desktop only: on touch screens an autofocused input would throw the keyboard up.
    if (entering && matchMedia('(hover: hover)').matches) ov.querySelector('input, .btn, .chipbtn')?.focus({ preventScroll: true });
  } else {
    if (ov.firstElementChild && !reduced()) leaveSheet(ov.firstElementChild, sheetExit);
    ov.innerHTML = ''; ui.sheetKey = '';
  }
  sheetExit = null;

  const md = document.getElementById('modal');
  if (ui.levelUp) {
    const lv = LEVELS[ui.levelUp - 1], entering = !md.firstElementChild;
    md.innerHTML = `<div class="modal${entering ? ' enter' : ''}" role="dialog" aria-modal="true" aria-label="Novo nível"><div class="modal-card">${hexagon(96, 'gradient', lv.n)}
      <div class="modal-k">${s.persona === 'kid' ? 'Você subiu de nível!' : 'A Lia subiu de nível!'}</div><h3>Nível ${lv.n}, ${lv.name}</h3>
      <div class="modal-b">${icon('gift', 18, 1.8, 'var(--orange)')}<span><b>Prêmio liberado:</b> ${lv.benefit}</span></div>
      <button type="button" class="btn primary block" data-a="levelup-ok">Continuar</button></div></div>`;
    md.querySelector('.btn').focus({ preventScroll: true });
    if (entering) { buzz([20, 60, 30]); confetti(md.querySelector('.hex')); }
  } else md.innerHTML = '';

  document.getElementById('panel').innerHTML = panelHtml().replace(/^<div class="panel">|<\/div>$/g, '');
  tweenValues();
  aiSync();
}

/* ================================================================ actions */
const val = id => document.getElementById(id)?.value ?? '';
const setErr = (id, msg) => { const el = document.getElementById(id); if (el) el.textContent = msg; };

function pinProblem(p) {
  if (!/^\d{6}$/.test(p)) return 'A senha precisa ter 6 números.';
  if (/^(\d)\1{5}$/.test(p)) return 'Números todos iguais são fáceis de adivinhar.';
  if ('01234567890'.includes(p) || '98765432109'.includes(p)) return 'Sequências como 123456 são as primeiras que um golpista tenta.';
  const dd = +p.slice(0, 2), mm = +p.slice(2, 4);
  if (dd >= 1 && dd <= 31 && mm >= 1 && mm <= 12) return 'Isso parece uma data. Nada de aniversário!';
  return null;
}

const ACTIONS = {
  back, close: closeSheet,
  backdrop: (el, e) => { if (e.target === el) closeSheet(); },
  go: el => {
    const { r, id, sheet } = el.dataset;   // read first: go() retires the tapped screen, data-* included
    go(id ? { r, id } : { r });
    if (sheet) openSheet({ t: sheet });
  },
  sheet: el => openSheet({ t: el.dataset.t, id: el.dataset.id }),
  lesson: el => go({ r: 'lesson', id: el.dataset.id }),
  demo: () => openSheet({ t: 'demo' }),
  persona: el => {
    endTrans();
    s.persona = el.dataset.p; ui.sheet = null; save(); render(true);

    if (!ui.resetArmed) { ui.resetArmed = true; render(); setTimeout(() => { if (ui.resetArmed) { ui.resetArmed = false; render(); } }, 3500); return; }
    endTrans(); aiReset(); ui.resetArmed = false; s = initialState(); Object.assign(ui, { sheet: null, levelUp: null, pick: {}, result: {} });

  approve: el => {

function aiTool(msg, persona) {
  const keys = aiDests(persona);
  return {
    name: 'mostrar_atalho',
    description: 'Põe um botão logo abaixo da sua resposta que leva a pessoa direto a uma tela do app. Retorna uma confirmação curta. Use quando a resposta falar de algo que a pessoa pode fazer agora no app.',
    inputSchema: {
      type: 'object',
      properties: {
        destino: { type: 'string', enum: keys, description: 'Tela de destino: ' + keys.map(k => `${k} = ${AI_DEST[k].what}`).join('; ') },
        rotulo: { type: 'string', description: 'Texto curto do botão, até 28 letras. Ex.: Guardar agora' },
      },
      required: ['destino'],
    },
    execute(input) {
      const key = String(input?.destino ?? '');
      if (!keys.includes(key)) throw new Error(`Destino desconhecido. Use um destes: ${keys.join(', ')}.`);
      if (msg.links.some(l => l.dest === key)) return 'Esse botão já está na resposta.';
      if (msg.links.length >= 2) throw new Error('A resposta já tem 2 botões.');
      msg.links.push({ dest: key, label: String(input?.rotulo ?? '').trim().slice(0, 32) || AI_DEST[key].label });
      aiPaint(msg);
      return 'Botão adicionado abaixo da resposta.';
    },
  };
}

/* Minimal markdown: escape first, then **bold**, "- " lists and paragraphs. */
function aiMd(t) {
  const LI = /^\s*(?:[-•*]|\d+[.)])\s+/;
  return esc(t.trim()).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').split(/\n{2,}/).map(block => {
    const lines = block.split('\n').filter(l => l.trim());
    if (lines.length && lines.every(l => LI.test(l))) return `<ul>${lines.map(l => `<li>${l.replace(LI, '')}</li>`).join('')}</ul>`;
    return `<p>${lines.join('<br>')}</p>`;
  }).join('');
}

  const note = m.note ? `<p class="ai-note${c}"${st}>${esc(m.note)}</p>` : '';
  const err = m.err ? `<div class="ai-err${c}"${st}>${icon('circle-alert', 16, 1.9)}<span>${esc(m.err)}</span>${m.retry ? `<button type="button" data-ai="retry" data-m="${m.id}">Tentar de novo</button>` : ''}</div>` : '';
  const thumb = (v, label, svg) => `<button type="button" data-ai="vote" data-m="${m.id}" data-v="${v}" aria-pressed="${m.vote === v}" aria-label="${label}">${svg}</button>`;
  const fb = m.ok && m.text ? `<div class="ai-fb${c}"${st}>${thumb('up', 'Gostei da resposta', AI_UP)}${thumb('down', 'Não gostei da resposta', AI_DOWN)}</div>` : '';
  return note + err + fb;
}

function aiRow(m, p, fresh) {
  const c = fresh ? ' in' : '';
  if (m.role === 'user') {
    const av = p === 'kid' ? '<span class="avatar" aria-hidden="true">L</span>' : `<span class="avatar navy" aria-hidden="true">${icon('user', 16, 2)}</span>`;
    return `<div class="ai-row me${c}" id="ai-m-${m.id}"><div class="ai-me"><span class="vh">Você:</span><div class="ai-msg me">${esc(m.text)}</div>
      <div class="ai-meta"><span>${m.at}</span>${AI_CHECK2}<span class="vh">enviada</span></div></div>${av}</div>`;
  }
  const live = m.state !== 'done';
  m.html = aiBody(m);   // what the body shows now, so aiPaint writes only when it changes
  return `<div class="ai-row bot${c}" id="ai-m-${m.id}">${aiMark(live)}<div class="ai-msg bot"${live ? ' aria-busy="true"' : ''}>${m.html}</div>
    <div class="ai-a-foot"${live ? '' : ' data-done'}><div class="ai-links">${m.links.map((l, k) => aiLink(m, k)).join('')}</div>${live ? '' : aiExtras(m)}</div></div>`;
}

function aiRender() {
  const p = s.persona, log = AI.msgs[p], el = $ai('ai-log'), last = AI.shown[p], intro = AI.intro;
  AI.intro = '';   // 'chat' after the loader (greeting and chips enter), 'chips' after a reset
  $ai('ai-sub').textContent = p === 'kid' ? 'Assistente de IA · conversando com a Lia' : 'Assistente de IA · conversando com o responsável';
  const sugs = log.length ? '' : `<div class="ai-sugs${intro ? ' in' : ''}">${AI_SUG[p].map((q, k) =>
    `<button type="button" class="ai-sug" data-ai="ask"${aiIn(!!intro, (intro === 'chat' ? 140 : 0) + k * 40)}>${esc(q)}</button>`).join('')}</div>`;
  el.innerHTML = `<div class="ai-row bot ai-hello${intro === 'chat' ? ' in' : ''}">${aiMark(false)}<div class="ai-msg bot"><p>${AI_HELLO[p]}</p></div>${sugs}</div>
    ${log.map(m => aiRow(m, p, m.id > last)).join('')}`;
  AI.shown[p] = Math.max(last, aiTop(p));
  el.scrollTop = el.scrollHeight;   // before the new rows paint; never a smooth scroll
  AI.painted = p;
  aiControls();
}

// Streamed text arrives per token; paint at most once a frame.
function aiQueue(msg) {
  AI.pend = msg;
  if (!AI.raf) AI.raf = requestAnimationFrame(() => { const m = AI.pend; AI.raf = 0; AI.pend = null; if (m) aiPaint(m); });
}

function aiPaint(msg) {
  const row = $ai('ai-m-' + msg.id);
  if (!row) return;   // the other persona's chat is on screen
  const el = $ai('ai-log'), stick = el.scrollHeight - el.scrollTop - el.clientHeight < 80;   // read, then write
  const body = row.querySelector('.ai-msg'), foot = row.querySelector('.ai-a-foot'), box = foot.firstElementChild, html = aiBody(msg);
  if (msg.html !== html) body.innerHTML = msg.html = html;
  let ms = 0;
  for (let k = box.children.length; k < msg.links.length; k++, ms += 50) box.insertAdjacentHTML('beforeend', aiLink(msg, k, true, ms));
  if (msg.state === 'done' && !foot.hasAttribute('data-done')) {
    foot.setAttribute('data-done', '');
    row.querySelector('.ai-mark').classList.remove('live');
    body.removeAttribute('aria-busy');   // the polite live region reads the finished answer, not every token
    foot.insertAdjacentHTML('beforeend', aiExtras(msg, true, ms));
  }
  if (stick) el.scrollTop = el.scrollHeight;
}

/* ---- the right-hand control: Stop while a reply streams; the mic when dictation is on offer and the box
   is empty (and while it listens); otherwise Send. Glyph swaps are instant: typing flips them. */
const aiHearing = () => AI.hear !== 'idle';
function aiControls() {
  const btn = $ai('ai-send'), ta = $ai('ai-text'), hear = aiHearing(), empty = !ta.value.trim();
  const mode = AI.ctl ? 'stop' : !AI.off && (hear || empty) ? 'mic' : 'send';   // no dictation here: the mic is for show and focuses the box
  if (btn.dataset.mode !== mode) {
    btn.dataset.mode = mode;
    btn.type = mode === 'mic' ? 'button' : 'submit';
    btn.innerHTML = mode === 'mic' ? AI_MIC : mode === 'stop' ? AI_STOP : AI_SEND;
  }
  btn.className = 'ai-act' + (mode === 'mic' ? ' mic' : '') + (mode === 'mic' && AI.hear === 'listening' ? ' listening' : '');
  btn.setAttribute('aria-label', mode === 'stop' ? 'Parar a resposta' : mode === 'send' ? 'Enviar' : hear ? 'Parar de ouvir' : 'Falar');
  if (mode === 'mic') btn.setAttribute('aria-pressed', String(hear)); else btn.removeAttribute('aria-pressed');
  if (mode === 'mic' && (AI.hear === 'starting' || AI.hear === 'finishing')) btn.setAttribute('aria-busy', 'true'); else btn.removeAttribute('aria-busy');
  btn.disabled = AI.off || (mode === 'send' && empty);
  ta.disabled = AI.off;
  $ai('ai-form').classList.toggle('off', AI.off);
  ta.placeholder = AI.off ? 'O Guia está desligado' : hear ? AI.partial || 'Ouvindo…' : 'Digite aqui';
  // A control that just turned disabled under the pointer hands focus to the box (not on touch: no surprise keyboard).
  if (btn.disabled && document.activeElement === btn && !ta.disabled && matchMedia('(hover: hover)').matches) ta.focus({ preventScroll: true });
}

function aiSync() {
  const on = !!AI.fn && !AI.off, fab = $ai('ai-fab'), show = on && !AI.cover;
  if (show && !AI.popped) { AI.popped = true; if (!reduced()) fab.classList.add('enter'); }
  fab.hidden = !show;
  $ai('phone').classList.toggle('has-ai', on);
  if (AI.open && AI.painted !== s.persona) { AI.shown[s.persona] = aiTop(s.persona); aiRender(); }   // a switch while open: no entrances
}

/* ---- open and close. The layer scales out of the button and back into it (a transition keyed off
   data-state, so a close mid-open retargets). While it is open the app beneath is inert. */
const aiUnder = () => [$ai('vp'), $ai('overlay'), $ai('modal'), document.querySelector('.proto-strip')];
function aiOrigin(w) {
  const f = $ai('ai-fab').getBoundingClientRect(), p = $ai('phone').getBoundingClientRect();
  w.style.transformOrigin = f.width ? `${f.left + f.width / 2 - p.left}px ${f.top + f.height / 2 - p.top}px` : '';
}
function aiCovered() {
  clearTimeout(AI.edge);
  if (!AI.open || AI.cover) return;
  AI.cover = true;
  aiSync();   // only now does the button go: it shows through the layer while that is still fading in
}

function aiOpen() {
  if (!AI.fn || AI.open) return;
  const w = $ai('ai-wrap'), first = !AI.loaded, quiet = reduced(), closing = !w.hidden;
  AI.open = true; AI.cover = false;
  clearTimeout(AI.wait); clearTimeout(AI.edge);
  for (const n of w.querySelectorAll('.in, .intro, .out')) n.classList.remove('in', 'intro', 'out');
  w.inert = false; delete w.dataset.ready;
  w.classList.toggle('loading', first);
  $ai('ai-load').hidden = !first; $ai('ai-chat').hidden = first;
  if (!closing) { w.hidden = false; w.dataset.state = 'closed'; }   // reopening mid-close retargets from where it is
  AI.shown[s.persona] = aiTop(s.persona);
  aiRender();   // after unhiding: it scrolls the log to the end
  for (const el of aiUnder()) if (el) el.inert = true;
  $ai('phone').classList.add('ai-on');
  aiOrigin(w);
  void w.offsetWidth;   // commit the closed frame so the change below transitions
  w.dataset.state = 'open';
  if (quiet) aiCovered(); else AI.edge = setTimeout(aiCovered, 360);   // in case transitionend is lost
  w.focus({ preventScroll: true });
  if (first) AI.wait = setTimeout(aiHandoff, quiet ? 450 : 900);
  else aiReady();
}

// Loader to chat: the loader fades and settles, the peach comes up, greeting and chips rise in, the pill fades in.
function aiHandoff() {
  const w = $ai('ai-wrap'), load = $ai('ai-load');
  AI.loaded = true;
  AI.intro = 'chat';
  $ai('ai-chat').hidden = false;
  aiRender();
  w.classList.remove('loading');
  if (reduced()) { load.hidden = true; aiReady(); return; }
  $ai('ai-foot').classList.add('intro');
  load.classList.add('out');
  AI.wait = setTimeout(() => { load.hidden = true; aiReady(); }, 180);
}

function aiReady() {
  const w = $ai('ai-wrap'), a = document.activeElement;
  w.dataset.ready = '';
  // Desktop only, as with sheets: on touch an autofocused box throws the keyboard up. Never steal a focus the user moved.
  if (matchMedia('(hover: hover)').matches && !AI.off && (a === w || !w.contains(a))) $ai('ai-text').focus({ preventScroll: true });
}

function aiClose() {
  if (!AI.open) return;
  const w = $ai('ai-wrap');
  AI.open = false; AI.cover = false;
  clearTimeout(AI.wait); clearTimeout(AI.edge);
  if (AI.loaded) $ai('ai-load').hidden = true;   // a close mid hand-off leaves on the chat
  aiMicStop();
  w.inert = true; delete w.dataset.ready;   // a leaving layer takes no taps or focus
  for (const el of aiUnder()) if (el) el.inert = false;
  aiSync();
  aiOrigin(w);
  const fab = $ai('ai-fab');
  if (!fab.hidden) fab.focus({ preventScroll: true });
  if (reduced()) { aiShut(); return; }
  w.dataset.state = 'closing';
  AI.edge = setTimeout(aiShut, 260);
}

function aiShut() {
  clearTimeout(AI.edge);
  if (AI.open) return;   // reopened while it was leaving
  const w = $ai('ai-wrap');
  w.hidden = true; w.inert = false; w.dataset.state = 'closed';
  $ai('phone').classList.remove('ai-on');
  // Entrance classes would replay the next time the layer is shown.
  for (const n of w.querySelectorAll('.in, .intro, .out')) n.classList.remove('in', 'intro', 'out');
}

/* ---- dictation. start() runs straight from the click, nothing awaited first. Final phrases are appended
   to the box; the person still presses Send. */
function aiDictation(d) {
  AI.dict = d;
  d.onState(({ state, reason }) => {
    const was = AI.hear;
    AI.hear = state;
    if (state !== 'listening') AI.partial = '';
    if (state === 'idle' && reason && was !== 'starting') aiMicEnd(reason, AI.used);   // a failed start is told by its rejection
    aiControls();
  });
  d.onPartial(({ text }) => { AI.partial = text.trim(); aiControls(); });
  d.onFinal(({ text }) => aiDictate(text));
  aiControls();
}

function aiMic() {
  const d = AI.dict;
  if (AI.off) return;
  if (!d || AI.micOff) { $ai('ai-text').focus(); return; }   // for show: the keyboard (and its own dictation key) opens
  if (aiHearing()) { d.stop().catch(() => {}); return; }
  const lang = AI.used = AI.lang;
  d.start(lang ? { language: lang } : undefined).catch(e => aiMicEnd(e?.code, lang));
}

function aiMicStop() { if (AI.dict && aiHearing()) AI.dict.stop().catch(() => {}); }

function aiMicEnd(code, lang) {
  if (code === 'not_granted') { AI.micOff = true; $ai('ai-text').focus(); aiMicSay('O microfone ficou desligado para o Guia. Você pode digitar a pergunta.'); }
  else if (code === 'unavailable' && lang) { AI.lang = ''; aiMicSay('Não deu para ouvir em português aqui. Toque no microfone de novo para tentar no idioma do navegador.'); }
  else if (code === 'unavailable') { AI.micOff = true; aiMicSay('O ditado não está disponível aqui. Você pode digitar a pergunta.'); }
  else if (code === 'rate_limited') aiMicSay('Muitos ditados ao mesmo tempo. Tente de novo daqui a pouco.');
  else if (!['stopped', 'viewer_stopped', 'hidden', 'time_limit', 'dismissed'].includes(code)) aiMicSay('Não consegui ouvir agora. Tente de novo ou digite.');
  aiControls();
}

function aiMicSay(text) {
  const el = $ai('ai-mic-msg');
  el.textContent = text;
  clearTimeout(AI.micT);
  AI.micT = setTimeout(() => { el.textContent = ''; }, 5000);
}

function aiDictate(text) {
  const ta = $ai('ai-text');
  if (!text || ta.disabled) return;
  const cur = ta.value.trim() ? ta.value : '';   // the platform never sees typed edits: join pieces ourselves
  const add = !cur ? text.trimStart() : /\s$/.test(cur) || /^\s/.test(text) ? text : ' ' + text;
  ta.value = (cur + add).slice(0, 600);
  aiGrow(ta); aiControls();
}

async function aiSend(raw) {
  const text = String(raw ?? '').trim().slice(0, 600);
  if (!text || AI.ctl || !AI.fn || AI.off) return;
  aiMicStop();
  const persona = s.persona, log = AI.msgs[persona];
  const history = log.filter(m => m.role === 'user' || m.ok).slice(-11).map(m => ({ role: m.role, content: m.text }));
  log.push({ id: ++AI.seq, role: 'user', text, at: new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) });
  const msg = { id: ++AI.seq, role: 'assistant', text: '', links: [], state: 'wait' };
  log.push(msg);
  const ctl = AI.ctl = new AbortController(), wasOff = AI.off;
  if (AI.open) aiRender();
  const opts = {
    modelTier: 'quick', cache: false, signal: ctl.signal,
    onText: ({ text: t }) => { msg.text = t; msg.state = 'stream'; aiQueue(msg); },
  };
  if (AI.tools) opts.tools = [aiTool(msg, persona)];
  try {
    const res = await AI.fn([{ role: 'user', content: aiRules(persona) }, ...history, { role: 'user', content: text }], opts);
    msg.text = res.text; msg.ok = true;
    if (res.truncated) msg.note = 'A resposta ficou longa e foi cortada. Peça uma versão mais curta.';
  } catch (e) {
    const code = e?.code;
    msg.text = code === 'refused' ? '' : (e?.text || '');
    if (code === 'cancelled') msg.note = 'Você parou a resposta.';
    else if (AI_OFF.includes(code)) { AI.off = true; msg.err = 'O Guia precisa da sua permissão para usar o Claude. Sem ela, o resto do protótipo continua funcionando.'; }
    else if (code === 'rate_limited') msg.err = 'Muitas perguntas seguidas. Espere um minutinho e tente de novo.';
    else if (code === 'session_expired') msg.err = 'Sua sessão do Claude expirou. Entre de novo e tente outra vez.';
    else if (code === 'refused') msg.err = 'Não posso responder isso. Tente perguntar de outro jeito.';
    else if (code === 'tools_unavailable') { AI.tools = false; msg.err = 'Os atalhos não funcionam aqui. Pergunte de novo e eu respondo sem eles.'; msg.retry = true; }
    else { msg.err = 'A resposta não chegou. Tente de novo.'; msg.retry = true; }
  } finally {
    msg.state = 'done';
    if (AI.ctl === ctl) AI.ctl = null;
    if (AI.pend === msg) AI.pend = null;
    aiPaint(msg);
    aiControls();
    if (AI.off && !wasOff) { aiMicStop(); render(); }   // drop the panel's mention of the guide too
    else aiSync();
  }
}

function aiRetry(id) {
  const log = AI.msgs[s.persona], k = log.findIndex(m => m.id === id);
  if (k < 1 || AI.ctl) return;
  const [q] = log.splice(k - 1, 2);
  aiSend(q.text);
}

// Thumbs are local only: they toggle, exclude each other and survive a re-render. Nothing is sent.
function aiVote(el) {
  const m = AI.msgs[s.persona].find(x => x.id === +el.dataset.m);
  if (!m) return;
  m.vote = m.vote === el.dataset.v ? null : el.dataset.v;
  for (const b of el.parentElement.children) b.setAttribute('aria-pressed', String(b.dataset.v === m.vote));
}

function aiGo(id, k) {
  const l = AI.msgs[s.persona].find(m => m.id === id)?.links[k], d = l && AI_DEST[l.dest];
  if (!d || d.p !== s.persona) return;
  aiClose(); endTrans();   // the layer is still fading out on top while the app moves
  s.stack[d.p] = d.stack.map(r => ({ ...r }));
  ui.sheet = d.sheet ? { ...d.sheet } : null;
  save(); render(true);
}

function aiReset() {
  AI.ctl?.abort();
  AI.msgs = { kid: [], parent: [] };
  if (AI.open) { AI.intro = 'chips'; aiRender(); }
}

function aiGrow(ta) { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 120) + 'px'; }

function aiPanelNote() {
  return AI.fn && !AI.off
    ? `<div class="p-ai">${AI_SPARK(16)}<span>Assistente de IA: toque no botão com a estrela laranja no canto da tela para conversar com o Guia.</span></div>` : '';
}

$ai('ai-fab').innerHTML = AI_SPARK(22);
$ai('ai-x').innerHTML = icon('x', 28, 1.5);
$ai('ai-star').innerHTML = AI_SPARK(28);
aiControls();

$ai('ai-fab').addEventListener('animationend', e => e.currentTarget.classList.remove('enter'));   // once per session
$ai('ai-wrap').addEventListener('transitionend', e => {
  const w = e.currentTarget;
  if (e.target !== w || e.pseudoElement || e.propertyName !== 'opacity') return;
  if (AI.open && w.dataset.state === 'open') aiCovered();
  else if (!AI.open && w.dataset.state === 'closing') aiShut();
});
document.addEventListener('click', e => {
  const el = e.target.closest('[data-ai]');
  if (!el || el.disabled) return;
  const k = el.dataset.ai;
  if (k === 'open') aiOpen();
  else if (k === 'close') aiClose();
  else if (k === 'ask') aiSend(el.textContent);
  else if (k === 'retry') aiRetry(+el.dataset.m);
  else if (k === 'link') aiGo(+el.dataset.m, +el.dataset.k);
  else if (k === 'vote') aiVote(el);
});
$ai('ai-send').addEventListener('click', e => { if (e.currentTarget.dataset.mode === 'mic') aiMic(); });   // type=button then: no submit
function aiSubmit() {
  const ta = $ai('ai-text');
  if (!ta.value.trim()) return;
  aiSend(ta.value);
  ta.value = ''; aiGrow(ta); aiControls();
}
$ai('ai-form').addEventListener('submit', e => {
  e.preventDefault();
  if (AI.ctl) { AI.ctl.abort(); return; }   // the control is Stop while a reply streams
  if (AI.dict && aiHearing()) { AI.dict.stop().catch(() => {}).then(aiSubmit); return; }   // send once the last words are in
  aiSubmit();
});
$ai('ai-text').addEventListener('input', e => { aiGrow(e.target); aiControls(); });
$ai('ai-text').addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.shiftKey || e.isComposing) return;
  e.preventDefault();
  if (!AI.ctl) $ai('ai-form').requestSubmit();
});
// Capture phase, so Escape closes the chat before the app's own handler closes a sheet under it.
window.addEventListener('keydown', e => {
  if (e.key === 'Escape' && AI.open) { e.stopImmediatePropagation(); aiClose(); }
}, true);

(async () => {
  if (typeof window.claude?.use !== 'function') return;
  // Dictation lights the mic up on its own; it never holds the guide back.
  window.claude.use('dictation').then(d => { if (d) aiDictation(d); }, () => {});
  try {
    const fn = await window.claude.use('sample');
    if (!fn) return;
    AI.tools = !!(await fn.limits().catch(() => null))?.tools;
    AI.fn = fn;
    render();
  } catch { /* no viewer: the guide stays hidden */ }
})();

render(true);
</script>
<script>
if ('serviceWorker' in navigator && window.isSecureContext) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
